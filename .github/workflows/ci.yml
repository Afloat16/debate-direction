name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Protocol, transport and report regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run the fixed offline example
        env:
          PYTHONPATH: src
        run: python -m debate_direction --demo --out runs/ci-demo
      - name: Install the package and check the entry point
        run: |
          python -m pip install .
          debate-direction --version
