name: Cross-platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Check that the packaged skill matches its source
        run: python scripts/sync_skill.py --check
      - name: Protocol, transport and report regression tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Run the fixed offline example
        env:
          PYTHONPATH: src
        run: python -m debate_direction --demo --out runs/ci-demo
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - name: Install the built wheel with pip
        shell: python {0}
        run: |
          from pathlib import Path
          import subprocess
          import sys
          wheels = list(Path('dist').glob('*.whl'))
          assert len(wheels) == 1, wheels
          subprocess.run([sys.executable, '-m', 'pip', 'install', str(wheels[0])], check=True)
      - name: Check the installed entry point and packaged skill
        working-directory: ${{ runner.temp }}
        run: |
          debate-direction --version
          python -c "from importlib.resources import files; assert files('debate_direction').joinpath('_skill/SKILL.md').is_file()"
      - name: Install the uv executable used by installer smoke tests
        if: matrix.python == '3.11'
        run: python -m pip install uv==0.12.23
      - name: Isolate installer data without changing the home directory
        if: matrix.python == '3.11'
        shell: python {0}
        run: |
          from pathlib import Path
          import os
          directory = Path(os.environ['RUNNER_TEMP']) / 'debate-direction-installer-smoke'
          directory.mkdir(parents=True, exist_ok=True)
          names = {
              'UV_TOOL_DIR': 'tools',
              'UV_TOOL_BIN_DIR': 'commands',
              'UV_PYTHON_INSTALL_DIR': 'python',
              'UV_CACHE_DIR': 'cache',
          }
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for variable, child in names.items():
                  output.write(f'{variable}={directory / child}\n')
      - name: Install twice from local source on macOS or Linux
        if: matrix.python == '3.11' && runner.os != 'Windows'
        shell: bash
        run: |
          sh install.sh --source "$GITHUB_WORKSPACE" --python 3.11
          sh install.sh --source "$GITHUB_WORKSPACE" --python 3.11
      - name: Install twice from local source on Windows
        if: matrix.python == '3.11' && runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\install.ps1 -Source $env:GITHUB_WORKSPACE -PythonVersion 3.11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\install.ps1 -Source $env:GITHUB_WORKSPACE -PythonVersion 3.11
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify the installed CLI, all host skills, idempotency, and removal
        if: matrix.python == '3.11'
        shell: python {0}
        run: |
          from pathlib import Path
          import json
          import os
          import subprocess
          root = Path(os.environ['RUNNER_TEMP']) / 'debate-direction-installer-smoke'
          command = Path(os.environ['UV_TOOL_BIN_DIR']) / ('debate-direction.exe' if os.name == 'nt' else 'debate-direction')
          subprocess.run([str(command), '--version'], check=True)
          subprocess.run([str(command), '--demo', '--out', str(root / 'demo')], check=True)
          project = root / 'host project with spaces'
          project.mkdir()
          arguments = [str(command), 'install-skill', '--host', 'all', '--project', str(project), '--json']
          first = json.loads(subprocess.check_output(arguments, text=True))
          second = json.loads(subprocess.check_output(arguments, text=True))
          assert {item['host'] for item in first} == {'codex', 'claude', 'kimi'}, first
          assert len(second) == 3 and all(item['status'] == 'unchanged' for item in second), second
          for item in second:
              assert (Path(item['path']) / 'SKILL.md').is_file(), item
          subprocess.run(['uv', 'tool', 'uninstall', 'debate-direction', '--no-config'], check=True)
          assert not command.exists(), command
