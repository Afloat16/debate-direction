[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debate-direction"
version = "0.2.0"
description = "Two-agent debate for turning ambiguous requests into reviewable directions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Afloat16"}]
keywords = ["agents", "debate", "requirements", "reasoning", "codex", "claude", "deepseek", "kimi"]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.scripts]
debate-direction = "debate_direction.cli:main"

[project.urls]
Repository = "https://github.com/Afloat16/debate-direction"
Documentation = "https://github.com/Afloat16/debate-direction#readme"
Issues = "https://github.com/Afloat16/debate-direction/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
debate_direction = ["_skill/*.md", "_skill/agents/*.yaml", "_skill/references/*.md"]
